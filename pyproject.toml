[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lab-fw"
version = "0.1.0"
description = "HP QA automation lab framework (mid-track)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]
[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    ]
[tool.pytest.ini_options]
markers = [
    "smoke: fast basic checks of lab_fw helpers",
    "regression: broader lab_fw checks",
    "user: doing with user",
    "config: doing wuth config",
    "mocks: mocks lab",
    "mocks_pure: pure unittest.mock tests",
    "mocks_httpx: httpx.MockTransport tests",
]
[project.entry-points.pytest11]
lab_fw = "lab_fw.pytest_plugin.plugin"