[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lab-fw"
version = "0.1.0"
description = "HP QA automation lab framework (mid-track)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]
[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "allure-pytest>=2.13",
    "pydantic>=2.0",
    "playwright>=1.63.0,<1.64.0",
    "selenium>=4.0",
    "filelock>=3.13",
]
dev_slim = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "allure-pytest>=2.13",
    "pydantic>=2.0",
    "playwright>=1.63.0,<1.64.0",
    "selenium>=4.0",
    "filelock>=3.13",
]
playwright = [
    "playwright>=1.63.0,<1.64.0",
]
selenium = [
    "selenium>=4.0",
]
[tool.pytest.ini_options]
junit_family = "legacy"
python_functions = ["test_*"]
markers = [
    "smoke: fast basic checks of lab_fw helpers",
    "regression: broader lab_fw checks",
    "user: doing with user",
    "config: doing wuth config",
    "mocks: mocks lab",
    "mocks_pure: pure unittest.mock tests",
    "mocks_httpx: httpx.MockTransport tests",
    "api: API authentication tests",
    "ui: UI tests",
    "selenium: selenium tests",
    "compose: tests that require Docker Compose services",
    "distributed_lab: distributed_lab tests", 
    "parallel_lab: parallel_lab tests",
    "serial: serial tests",
    "reporting: reporting tests"
]
[project.entry-points.pytest11]
lab_fw = "lab_fw.pytest_plugin.plugin"