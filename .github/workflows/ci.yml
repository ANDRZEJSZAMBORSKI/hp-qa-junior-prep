name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Allure results
        run: |
          rm -rf allure-results
          mkdir -p allure-results
          cp categories.json allure-results/
      #    cp environment.properties allure-results/



      #- name: Build CI image
      #  run: docker build --target ci -t hp-qa-junior-prep:ci .

      #- name: Run tests
      #  run: docker run --rm hp-qa-junior-prep:ci

      - name: Run API and non-UI tests
        if: ${{ !cancelled() }}
        run: docker compose up --build --abort-on-container-exit tests
        env:
          DOCKER_TARGET: ci
      
      - name: Stop API containers
        if: always()
        run: docker compose down

      - name: Run Selenium tests in parallel
        if: ${{ !cancelled() }}
        run: docker compose --profile selenium run --build --rm selenium-tests
        env:
          DOCKER_TARGET: ci
      
      - name: Run Selenium tests serially
        if: ${{ !cancelled() }}
        run: docker compose --profile selenium run --build --rm selenium-tests-serial
        env:
          DOCKER_TARGET: ci

      - name: Stop Selenium containers
        if: always()
        run: docker compose --profile selenium down


      - name: Run Playwright tests in parallel
        if: ${{ !cancelled() }}
        run: docker compose --profile playwright run --build --rm playwright-tests
        env:
          DOCKER_TARGET: ci

      - name: Run Playwright tests serially
        if: ${{ !cancelled() }}
        run: docker compose --profile playwright run --build --rm playwright-tests-serial
        env:
          DOCKER_TARGET: ci

      - name: Stop Playwright containers
        if: always()
        run: docker compose --profile playwright down

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
