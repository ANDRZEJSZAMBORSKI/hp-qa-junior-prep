name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI image
        run: docker build --target ci -t hp-qa-junior-prep:ci .

      - name: Run tests
        run: docker run --rm hp-qa-junior-prep:ci