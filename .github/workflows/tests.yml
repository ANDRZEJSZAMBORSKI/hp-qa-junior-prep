name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Run tests (no UI)
        run: pytest -m "not ui and not selenium" -q --tb=line