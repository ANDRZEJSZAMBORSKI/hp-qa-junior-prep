name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-api:
    runs-on: ubuntu-latest

    env:
      LAB_FW_API_TOKEN: ${{ secrets.LAB_FW_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Check secret is available
        run: |
          if [ -z "$LAB_FW_API_TOKEN" ]; then
            echo "LAB_FW_API_TOKEN is empty"
            exit 1
          fi
          echo "LAB_FW_API_TOKEN length: ${#LAB_FW_API_TOKEN}"

      - name: Run tests (no UI)
        run: pytest -m "not ui and not selenium and not compose" -q -n auto --alluredir=allure-results --tb=line

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/